[project]
name = "velo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mattéo DETALLE", email = "matteo.detalle@student.junia.com" }
]
requires-python = ">=3.13"
dependencies = [
    "platformdirs>=4.14.8",
    "pydantic>=2.14.4",
    "pyyaml>=6.0.4",
    "requests>=2.34.2",
    "rich>=15.0.0",
]

[project.scripts]
velo = "velo:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
